<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ player[1] }} - PlayerShowcase</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="profile-page">

    <div class="profile-bg">
        <div class="bg-gradient-sweep"></div>
        <svg class="profile-pitch-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <circle cx="900" cy="400" r="260" fill="none" stroke="rgba(0,230,118,0.06)" stroke-width="2"/>
            <circle cx="900" cy="400" r="140" fill="none" stroke="rgba(0,230,118,0.05)" stroke-width="2"/>
            <circle cx="900" cy="400" r="5" fill="rgba(0,230,118,0.15)"/>
            <line x1="900" y1="0" x2="900" y2="800" stroke="rgba(0,230,118,0.04)" stroke-width="1.5"/>
        </svg>
        <div class="light-beam lb1"></div>
        <div class="light-beam lb2"></div>
        <div class="light-beam lb3"></div>
    </div>

    <div class="particles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span>
    </div>

    <nav class="navbar">
        <div class="nav-brand">
            <a href="/" class="nav-brand-link">
                <span class="ball-icon">PS</span>
                <span class="brand-text">Player<strong>Showcase</strong></span>
            </a>
        </div>
        <div class="nav-links">
            <a href="/players" class="nav-btn">All Players</a>
            <a href="/register" class="nav-btn nav-btn-accent">Register</a>
        </div>
    </nav>

    <main class="profile-main">
        <div class="profile-player-side" id="playerSide">
            <div class="player-glow-ring" id="glowRing"></div>

            <div class="player-figure-wrap" id="playerFigure">
                <img src="{{ url_for('static', filename='player.png') }}"
                     class="profile-figure-img"
                     alt="{{ player[1] }}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="profile-figure-fallback">
                    <div class="fallback-silhouette">
                        <svg viewBox="0 0 200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="100" cy="45" r="32" fill="rgba(0,230,118,0.15)" stroke="rgba(0,230,118,0.4)" stroke-width="2"/>
                            <path d="M60 130 Q100 110 140 130 L155 230 Q100 255 45 230 Z" fill="rgba(0,230,118,0.12)" stroke="rgba(0,230,118,0.35)" stroke-width="2"/>
                            <path d="M60 135 Q30 175 25 215" stroke="rgba(0,230,118,0.35)" stroke-width="14" stroke-linecap="round"/>
                            <path d="M140 135 Q170 165 185 195" stroke="rgba(0,230,118,0.35)" stroke-width="14" stroke-linecap="round"/>
                            <path d="M75 228 Q65 290 55 345" stroke="rgba(0,230,118,0.35)" stroke-width="16" stroke-linecap="round"/>
                            <path d="M125 228 Q145 270 175 295" stroke="rgba(0,230,118,0.35)" stroke-width="16" stroke-linecap="round"/>
                            <ellipse cx="50" cy="352" rx="22" ry="10" fill="rgba(0,230,118,0.3)" stroke="rgba(0,230,118,0.5)" stroke-width="1.5"/>
                            <ellipse cx="185" cy="300" rx="22" ry="10" fill="rgba(0,230,118,0.3)" stroke="rgba(0,230,118,0.5)" stroke-width="1.5" transform="rotate(-30 185 300)"/>
                        </svg>
                        <div class="figure-initial">{{ player[1][0] }}</div>
                    </div>
                </div>
                <div class="player-shadow"></div>
            </div>

            <div class="floating-position-tag" id="posTag">{{ player[3] }}</div>
            <div class="profile-bg-name" id="bgName">
                {{ player[1].upper().split()[0] if ' ' in player[1] else player[1].upper() }}
            </div>
        </div>

        <div class="profile-card-wrap" id="profileCard">
            <div class="profile-card">
                <div class="profile-card-accent"></div>

                <div class="profile-avatar-section">
                    <div class="profile-avatar-ring">
                        <img src="{{ url_for('static', filename='player.png') }}"
                             class="profile-avatar-img"
                             alt="{{ player[1] }}"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="profile-avatar-fallback">{{ player[1][0] }}</div>
                    </div>
                    <div class="profile-rating-badge">
                        <span class="rating-num">92</span>
                        <span class="rating-label">OVR</span>
                    </div>
                </div>

                <h1 class="profile-name">{{ player[1] }}</h1>
                <div class="profile-position-pill">{{ player[3] }}</div>

                <div class="profile-stats-grid">
                    <div class="profile-stat">
                        <span class="ps-icon">Age</span>
                        <span class="ps-val">{{ player[2] }}</span>
